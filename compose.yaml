services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PORTFOLIO_DB_NAME}
      POSTGRES_USER: ${PORTFOLIO_DB_USERNAME}
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
    ports:
      - "${PORTFOLIO_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  member-mock:
    image: wiremock/wiremock:3.13.2-2
    ports:
      - "${PORTFOLIO_MEMBER_MOCK_PORT:-8083}:8080"
    volumes:
      - ./member-mock:/home/wiremock:ro
    entrypoint:
      - /docker-entrypoint.sh
      - --global-response-templating
      - --disable-gzip

volumes:
  postgres_data:
